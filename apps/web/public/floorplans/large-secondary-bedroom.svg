<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1170" viewBox="0 0 800 780">
  <defs>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,7 L7,1" stroke="#64748b" stroke-width="1.2"/></marker>
    <style>
      .title{font:700 24px 'Arial',sans-serif;fill:#172033}.sub{font:13px 'Arial',sans-serif;fill:#64748b}.label{font:700 22px 'Arial',sans-serif;fill:#263142;text-anchor:middle}.area{font:15px 'Arial',sans-serif;fill:#516071;text-anchor:middle}.wall{fill:#33363a}.floor{fill:#f5ead6}.bay{fill:#d8dee5;stroke:#697480;stroke-width:2}.win{stroke:#697480;stroke-width:2;fill:none}.door{stroke:#566270;stroke-width:2.2;fill:none}.dim{stroke:#64748b;stroke-width:1.2;fill:none;marker-start:url(#tick);marker-end:url(#tick)}.ext{stroke:#94a3b8;stroke-width:1}.dt{font:13px 'Arial',sans-serif;fill:#3d4a5c;text-anchor:middle}.note{font:12px 'Arial',sans-serif;fill:#526174}.thin{stroke:#d7cbb8;stroke-width:1}
    </style>
  </defs>
  <rect width="800" height="780" fill="#fff"/>
  <text x="52" y="48" class="title">BEDROOM 1 · DIMENSIONED PLAN</text>
  <text x="52" y="72" class="sub">Clear dimensions in millimetres · door R=900 · bay window D=650 / sill H=600 mm</text>

  <!-- room clear area: 2716 x 3108 -->
  <rect x="210" y="132" width="435" height="497" class="floor"/>
  <path d="M210 132H645V629H210Z" class="thin" fill="none"/>
  <!-- walls, with top-left door opening and full-width bay-window opening -->
  <rect x="180" y="102" width="30" height="557" class="wall"/>
  <rect x="645" y="102" width="30" height="557" class="wall"/>
  <rect x="354" y="102" width="321" height="30" class="wall"/>
  <rect x="210" y="102" width="144" height="30" fill="#f5ead6"/>

  <!-- inward-opening door: hinge at right end; exact leaf/swing radius 900 mm -->
  <path d="M354 132H210M354 132V276M210 132A144 144 0 0 0 354 276" class="door"/>
  <text x="286" y="244" class="note" text-anchor="middle">R=900</text>
  <path d="M210 132V160M354 132V160" class="ext"/>
  <path d="M210 152H354" class="dim"/>
  <text x="282" y="145" class="dt">900</text>

  <!-- bay window: bottom, full clear width -->
  <rect x="210" y="629" width="435" height="104" rx="2" class="bay"/>
  <path d="M220 644H635M220 718H635" class="win"/>
  <text x="427.5" y="684" class="note" text-anchor="middle">BAY WINDOW · D=650 · H=600</text>
  <path d="M645 629H710M645 733H710" class="ext"/>
  <path d="M701 629V733" class="dim"/>
  <text x="709" y="681" class="dt" transform="rotate(-90 709 681)">650</text>

  <text x="427.5" y="364" class="label">BEDROOM 1</text>
  <text x="427.5" y="388" class="area">8.44 m²</text>

  <!-- dimensions -->
  <path d="M210 132V82M645 132V82" class="ext"/>
  <path d="M210 91H645" class="dim"/>
  <text x="427.5" y="84" class="dt">2716</text>

  <path d="M210 132H145M210 629H145" class="ext"/>
  <path d="M154 132V629" class="dim"/>
  <text x="146" y="380.5" class="dt" transform="rotate(-90 146 380.5)">3108</text>

  <path d="M645 132H710M645 629H710" class="ext"/>
  <path d="M701 132V629" class="dim"/>
  <text x="709" y="380.5" class="dt" transform="rotate(-90 709 380.5)">3108</text>

  <text x="52" y="772" class="note">Note: door W/R=900 mm; bay window matches the room width, D=650 mm and sill H=600 mm.</text>
</svg>
