<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 820 880">
  <defs>
    <marker id="tick" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1,7 L7,1" stroke="#64748b" stroke-width="1.2"/></marker>
    <style>
      .title{font:700 24px 'Arial',sans-serif;fill:#172033}.sub{font:13px 'Arial',sans-serif;fill:#64748b}.label{font:700 22px 'Arial',sans-serif;fill:#263142;text-anchor:middle}.area{font:15px 'Arial',sans-serif;fill:#516071;text-anchor:middle}.wallline{stroke:#33363a;stroke-width:30;stroke-linejoin:miter;fill:none}.floor{fill:#f5ead6;stroke:#d7cbb8;stroke-width:1}.bay{fill:#d8dee5;stroke:#697480;stroke-width:2}.win{stroke:#697480;stroke-width:2;fill:none}.door{stroke:#566270;stroke-width:2.2;fill:none}.erase{stroke:#f5ead6;stroke-width:34}.dim{stroke:#64748b;stroke-width:1.2;fill:none;marker-start:url(#tick);marker-end:url(#tick)}.ext{stroke:#94a3b8;stroke-width:1}.dt{font:13px 'Arial',sans-serif;fill:#3d4a5c;text-anchor:middle}.note{font:12px 'Arial',sans-serif;fill:#526174}
    </style>
